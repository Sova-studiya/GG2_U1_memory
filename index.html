<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hobby Memory: do · go · play</title>
<style>
:root{--bg:#fff3c4;--card:#fff;--ink:#1d2b4f;--bk:#ffb81f;--g:#2e9e4f;--b:#1f6fd6;--o:#e8542a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2236;--card:#2a3350;--ink:#f3f5ff;--bk:#c99a1a}}
:root[data-theme="dark"]{--bg:#1b2236;--card:#2a3350;--ink:#f3f5ff;--bk:#c99a1a}
html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:8px}
header{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto 8px;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(20px,5vw,32px)}h1 span:nth-child(1){color:var(--g)}h1 span:nth-child(2){color:var(--b)}h1 span:nth-child(3){color:var(--o)}
.st{font-size:18px;display:flex;gap:12px;align-items:center}button{font:inherit;cursor:pointer}
.ic{border:0;background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:600px;margin:0 auto}
@media(min-width:900px){.grid{grid-template-columns:repeat(8,1fr);max-width:1000px}}
.card{aspect-ratio:3/4;perspective:600px;cursor:pointer}.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.open .in{transform:rotateY(180deg)}.f{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.bk{background:linear-gradient(135deg,var(--bk),var(--o));color:#fff;font-size:clamp(28px,8vw,48px);font-weight:700}
.fr{background:#fff;color:#1d2b4f;transform:rotateY(180deg);padding:4px;box-sizing:border-box;overflow:hidden}.fr img{width:100%;flex:1;min-height:0;object-fit:contain}
.fr small{font-size:clamp(9px,2.4vw,12px);text-align:center;font-weight:700;line-height:1.1;padding:2px 0}
.mt .f{outline:3px solid var(--g)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
@media(min-width:700px){#m{align-items:center}}
#sheet{background:var(--card);width:min(560px,100%);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;text-align:center;max-height:100%;overflow:auto}
@media(min-width:700px){#sheet{border-radius:20px}}
.pic{height:clamp(90px,22vh,170px);background:#fff;border-radius:12px;padding:4px}
.sen{font-size:clamp(20px,5.5vw,28px);font-weight:700;margin:8px 0}.sen b{color:var(--o);border-bottom:3px dashed var(--o)}
.vb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.vb button,.row button,.go2{border:0;border-radius:12px;padding:12px 6px;font-size:20px;font-weight:700;color:#fff;background:var(--b)}
.vb .do{background:var(--g)}.vb .play{background:var(--o)}button:disabled{opacity:.35}.vb .ok{opacity:1;outline:3px solid #fff}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:50px;margin:8px 0;padding:6px;border-radius:12px;background:rgba(127,127,127,.15)}
.row button{padding:8px 12px;font-size:18px;background:var(--b)}#fb{min-height:24px;font-weight:700}.big{font-size:40px;margin:0}.go2{padding:12px 28px;background:var(--g)}
.ru{opacity:.75;font-size:14px}ul{text-align:left;padding-left:20px;line-height:1.5}
</style></head><body>

 hs.forEach(h=>{const k=h[2]||h[1],s=WHO[k];C.push({k,v:h[0],p:h[1],s,pl:0,t:0},{k,v:h[0],p:h[1],s,pl:0,t:0})});
 C=SH(C);open=[];lock=0;sc=0;mv=0;st=0;left=12;stats();
 $('g').innerHTML=C.map((c,i)=>`<div class="card" id="c${i}" onclick="pick(${i})"><div class="in"><div class="f bk">?</div><div class="f fr"><img src="${IMG[c.k]}" alt=""><small id="t${i}">${sen(c)}</small></div></div></div>`).join('');hide()}
function pick(i){const c=C[i];if(lock||c.m||open.includes(i))return;open.push(i);$('c'+i).classList.add('open');lock=1;
 if(open.length==1||C[open[0]].k==c.k)verb(i);else scr(i)}
function verb(i,m=0){mm=m;const c=C[i];show(`<img class="pic" src="${IMG[c.k]}"><p class="sen">${c.t?c.s+' doesn’t':c.s} <b id="bl">___</b> ${c.p}.</p><div class="vb">${VB.map(v=>`<button class="${v.replace(/e?s$/,'')}" onclick="ans(${i},'${v}',this)">${v}</button>`).join('')}</div><p id="fb"></p>`)}
function ans(i,v,b){const c=C[i];
 if(v==form(c.v,c.pl)){add(10);document.querySelectorAll('.vb button').forEach(x=>x.disabled=1);b.disabled=0;b.classList.add('ok');$('bl').textContent=v;$('t'+i).textContent=sen(c,v);
  setTimeout(()=>{hide();open.length==2?(mm?miss():match()):lock=0},800)}
 else{add(-5);b.disabled=1;$('fb').textContent='Try again! Name + verb with -s'}}
function match(){open.forEach(i=>$('c'+i).classList.add('mt'));open.forEach(i=>C[i].m=1);add(20+5*st);st++;mv++;left--;open=[];stats();lock=0;if(!left)setTimeout(end,700)}
function scr(i){const c=C[open[0]],q=0,w=[c.s,'does','not',c.v,...c.p.split(' ')],ok=w.join(' ');let pool,a=[];
 do pool=SH(w.map((t,k)=>({t,k})));while(pool.map(x=>x.t).join(' ')==ok);
 show(`<img class="pic" src="${IMG[C[i].k]}"><p class="sen">Not a match! Make a negative sentence about the FIRST card:</p><div id="an" class="row"></div><div id="pl" class="row"></div><p id="fb"></p>`);
 const draw=()=>{[['an',a],['pl',pool.filter(x=>!a.includes(x))]].forEach(([id,arr])=>{const d=$(id);d.innerHTML='';arr.forEach(x=>{const b=document.createElement('button');b.textContent=x.t;b.onclick=()=>{a=id=='an'?a.filter(y=>y!=x):[...a,x];draw();if(a.length==w.length)chk()};d.append(b)})})};
 const chk=()=>{if(a.map(x=>x.t).join(' ')==ok){add(5);$('fb').textContent='✓ '+ok+(q?'?':'.');setTimeout(()=>verb(i,1),1200)}else{add(-3);$('fb').textContent='Wrong order! Try again.';a=[];draw()}};
 draw()}
function miss(){add(-3);st=0;mv++;stats();open.forEach(i=>{const c=C[i];$('c'+i).classList.remove('open');$('t'+i).textContent=sen(c)});open=[];setTimeout(()=>lock=0,500)}
function end(){const s=mv<=16?3:mv<=22?2:1;show(`<h2>🎉 Great job!</h2><p class="big">${'⭐'.repeat(s)}</p><p>Score: <b>${sc}</b> · Moves: <b>${mv}</b></p><button class="go2" onclick="start()">Play again</button>`)}
start();rules();
</script></body></html>
